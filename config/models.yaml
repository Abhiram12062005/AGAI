# Gemini through Google AI Studio's free API tier. Create a key at
# https://aistudio.google.com/apikey and set GEMINI_API_KEY in .env. Free-tier requests may be
# used to improve Google's products; do not send confidential repository content unless allowed.
provider: google

# Per-role model selection (task-model fit). Every field is swappable with no code change.
#
#   manager   - routing + state evaluation only. Cheapest/fastest tier; frontier capability
#               is wasted on choosing between 2-3 allowed transitions.
#   diagnoser - multi-step ReAct reasoning over stack traces, logs and code -> strongest
#               reasoning model at high effort.
#   fixer     - code generation/editing from an already-localised diagnosis -> strong coding
#               model at lower cost than the diagnoser.
#   judge     - LLM-as-judge. MUST differ from both generating agents (diagnoser, fixer) to
#               avoid self-preference bias; enforced at load time in codefix/config.py.
#
roles:
  manager:
    model: gemini-3.1-flash-lite
    effort: low
    max_tokens: 2048
  diagnoser:
    model: gemini-3.8-flash
    effort: high
    max_tokens: 16000
  fixer:
    model: gemini-3.8-flash
    effort: medium
    max_tokens: 16000
  judge:
    model: gemini-3.1-flash-lite
    effort: medium
    max_tokens: 8000

# Google AI Studio free-tier requests cost $0. Paid-tier prices are deliberately not
# represented here, so telemetry under-reports costs if billing is enabled for the project.
pricing:
  gemini-3.1-flash-lite: {input: 0.0, output: 0.0}
  gemini-3.8-flash:      {input: 0.0, output: 0.0}
  claude-haiku-5-5:  {input: 0.10, output: 0.50,  cache_read: 0.01, cache_write: 0.125}
  claude-sonnet-5-5: {input: 2.00, output: 10.00, cache_read: 0.20, cache_write: 2.50}
  claude-opus-5-5:   {input: 4.00, output: 20.00, cache_read: 0.20, cache_write: 5.00}
  claude-fable-5-1:  {input: 10.0, output: 50.00, cache_read: 0.25, cache_write: 12.50}
  claude-opus-4-8:   {input: 5.00, output: 25.00, cache_read: 0.50, cache_write: 6.25}
  claude-opus-5:     {input: 5.00, output: 25.00, cache_read: 0.50, cache_write: 6.25}
  claude-sonnet-5:   {input: 2.00, output: 10.00, cache_read: 0.20, cache_write: 2.50}
  mock:              {input: 0.0,  output: 0.0,   cache_read: 0.0,  cache_write: 0.0}

# Paid-tier list prices (USD per 1M text tokens) used ONLY for the benchmark report's
# "what would this cost if billed" estimate. Source: ai.google.dev/gemini-api/docs/pricing,
# read 2026-10-22 (gemini-3.8-flash promotional price, valid through 2026-12-31).
estimate_pricing:
  gemini-3.8-flash (all agents):      {input: 0.75, output: 3.75}
  gemini-3.1-flash-lite (all agents): {input: 0.25, output: 1.50}

pipeline:
  max_attempts: 3            # Fixer attempts before escalating to a human
  react_max_iterations: 8    # Diagnoser ReAct cap; degrades to best-effort diagnosis
  max_rediagnoses: 1         # Manager may ask for one re-diagnosis on a weak diagnosis
  rediagnose_below_confidence: 0.35
  test_timeout_s: 180
  allow_test_edits: false    # patches that modify test files are rejected
  rag_k: 6
  prompt_variant: react      # react | fewshot | react-reflect   (override per run: --variant)
  persona: default           # default | senior | novice | security (override per run: --persona)
