[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codefix-ai"
version = "0.1.0"
description = "CodeFix AI: autonomous hierarchical multi-agent bug resolution (Google ADK + CrewAI over A2A, MCP, Blackboard)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Agentic frameworks: CrewAI + Google ADK only (course rule), talking over A2A.
    "crewai==1.15.28",
    "google-adk[a2a]==2.12.0",
    "a2a-sdk==1.2.3",
    "anthropic==1.13.0",
    "mcp[cli]==1.28.1",
    "pydantic==2.12.5",
    "PyYAML==6.0.3",
    "python-dotenv==1.2.4",
    "typer==0.27.3",
    "rich==14.3.4",
    "fastapi==0.141.1",
    "uvicorn[standard]==0.54.0",
    "chromadb==1.5.9",
    "sentence-transformers==6.1.0",
    "PyGithub==2.10.0",
    "ruff==0.17.0",
    # no Windows wheel (needs a Rust toolchain); code_search falls back to a pure-Python scan
    "ripgrep==15.1.0; sys_platform != 'win32'",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
codefix = "codefix.cli.main:main"

[tool.setuptools.packages.find]
include = ["codefix*", "mcp_server*", "web*"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["benchmarks/bugset/repos", ".codefix", "traces"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "UP007"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
